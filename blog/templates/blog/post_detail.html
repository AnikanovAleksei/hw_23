{% extends 'blog/base.html' %}

{% block title %}
    Главная страница – Блог
{% endblock %}

{% block content %}
<body>
<div class="mt-3">
    {% include 'blog/_menu.html' %}
</div>
<div class="container">
    <h1 class="mb-4">{{ post.title }}</h1>
    <p>{{ post.content }}</p>
    <img src="{{ post.image.url }}" style="max-width: 100%; height: auto;">
    <p>Просмотры: {{ post.number_of_views }}</p>
    <p>Создано: {{ post.created_at }}</p>
    <a href="{% url 'blog:post_list' %}">Отмена</a>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
{% endblock %}
