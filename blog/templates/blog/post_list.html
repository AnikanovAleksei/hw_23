{% extends 'blog/base.html' %}

{% block title %}
    Главная страница – Создание поста
{% endblock %}

{% block content %}
<body>
<div class="mt-3">
    {% include 'blog/_menu.html' %}
</div>
    <div class="container mt-3">
        <h1 class="mb-4">Список постов</h1>
        <a href="{% url 'blog:post_create' %}" class="btn btn-primary">Создать новый пост</a>
        <ul class="list-group">
            {% for post in posts %}
            <li class="list-group-item">
                <a href="{% url 'blog:post_detail' post.pk %}">{{post.title}}</a>
                <a href="{% url 'blog:post_update' post.pk %}" class="btn btn-secondary">Редактировать</a>
                <a href="{% url 'blog:post_delete' post.pk %}" class="btn btn-danger">Удалить</a>
            </li>
            {% endfor %}
        </ul>
    </div>
    <script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
{% endblock %}
