{% extends 'catalog/base.html' %}

{% block title %}
    Главная страница – Skystore
{% endblock %}

{% block content %}
<body>
<div class="mt-3">
    {% include 'catalog/_menu.html' %}
</div>
<div class="mt-5">
    <div class="row row-cols-1 row-cols-md-4 mb-3 text-center">
        <div class="col offset-md-1">
            <div class="card mb-3 rounded-3 shadow-sm">
                <div class="card-header py-2">
                    <h6 class="my-0 fw-normal">{{ object.category }}</h6>
                </div>
                <div class="card-body">
                    <img src="{{ product.image.url }}" alt="{{ product.name }}" class="img-fluid mb-2">
                    <h5 class="card-title pricing-card-title">{{ object.price }}₽</h5>
                    <ul class="list-unstyled mt-2 mb-3">
                        <li>{{ object.name }}</li>
                        <li>{{ object.description }}</li>
                    </ul>
                    <a class="btn btn-sm btn-primary" href="{% url 'catalog:product_list' %}" role="button">Назад</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
