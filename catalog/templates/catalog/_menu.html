<nav class="ms-5 d-flex align-items-center">
    <a class="p-2 btn btn-outline-primary" href="/catalog/products/">Каталог</a>
    <a class="p-2 btn btn-outline-primary" href="/catalog/contacts/">Контакты</a>
    <a class="p-2 btn btn-outline-primary" href="/blogs/post/list/">Блог</a>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'users:logout' %}" class="d-inline">
        {% csrf_token %}
        <button type="submit" class="p-2 btn btn-outline-primary">Выйти</button>
    </form>
    {% else %}
    <a class="p-2 btn btn-outline-primary" href="{% url 'users:register' %}">Регистрация</a>
    <a class="p-2 btn btn-outline-primary" href="{% url 'users:login' %}">Вход</a>
    {% endif %}
</nav>
